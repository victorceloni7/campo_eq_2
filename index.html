
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cálculo de Campo Equivalente - Radioterapia</title>

  <style>
    body{
      font-family: Arial, sans-serif;
      background:#f2f5f7;
      margin:0;
      padding:20px;
      color:#222;
    }

    h1{
      text-align:center;
      margin-bottom:10px;
    }

    .container{
      display:flex;
      gap:20px;
      flex-wrap:wrap;
    }

    .panel{
      background:white;
      border-radius:12px;
      padding:16px;
      box-shadow:0 2px 8px rgba(0,0,0,0.1);
      flex:1;
      min-width:320px;
    }

    canvas{
      border:1px solid #ccc;
      max-width:100%;
      cursor:crosshair;
    }

    label{
      display:block;
      margin-top:12px;
      font-weight:bold;
    }

    input[type="range"]{
      width:100%;
    }

    button{
      margin-top:15px;
      padding:10px 18px;
      border:none;
      border-radius:8px;
      background:#0066cc;
      color:white;
      font-size:15px;
      cursor:pointer;
    }

    button:hover{
      background:#004e9e;
    }

    .result{
      margin-top:20px;
      background:#eef7ee;
      padding:15px;
      border-radius:10px;
      font-size:18px;
    }

    .info{
      font-size:14px;
      color:#555;
      margin-top:10px;
    }

    .steps{
      line-height:1.8;
    }
  </style>
</head>
<body>

<h1>Cálculo de Campo Equivalente (Radioterapia)</h1>

<div class="container">

  <div class="panel">
    <label>Selecionar imagem do campo:</label>
    <input type="file" id="imageLoader" accept="image/*">

    <label>Contraste / Threshold:</label>
    <input type="range" id="threshold" min="0" max="255" value="100">

    <div class="info">
      Clique em dois pontos da imagem para calibrar a escala.
    </div>

    <canvas id="canvas"></canvas>

    <label>Distância real entre os pontos (cm):</label>
    <input type="number" id="realDistance" step="0.1" value="10">

    <button id="calculateBtn">
      Calcular Campo Equivalente
    </button>

  </div>

  <div class="panel">
    <h2>Resultados</h2>

    <div class="steps">
      <b>Equação:</b><br>
      Ceq = 4 × A / P
    </div>

    <div class="result" id="results">
      Aguardando processamento...
    </div>
  </div>

</div>

<script>

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const imageLoader = document.getElementById('imageLoader');
const thresholdSlider = document.getElementById('threshold');
const calculateBtn = document.getElementById('calculateBtn');

let img = new Image();

let calibrationPoints = [];
let pixelsPerCm = null;

imageLoader.addEventListener('change', handleImage);

function handleImage(e){

  const reader = new FileReader();

  reader.onload = function(event){

    img.onload = function(){

      canvas.width = img.width;
      canvas.height = img.height;

      ctx.drawImage(img,0,0);

      calibrationPoints = [];
      pixelsPerCm = null;
    }

    img.src = event.target.result;
  }

  reader.readAsDataURL(e.target.files[0]);
}

canvas.addEventListener('click', function(e){

  const rect = canvas.getBoundingClientRect();

  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  calibrationPoints.push({x,y});

  ctx.fillStyle = "red";
  ctx.beginPath();
  ctx.arc(x,y,5,0,Math.PI*2);
  ctx.fill();

  if(calibrationPoints.length === 2){

    const dx = calibrationPoints[1].x - calibrationPoints[0].x;
    const dy = calibrationPoints[1].y - calibrationPoints[0].y;

    const pixelDistance = Math.sqrt(dx*dx + dy*dy);

    const realDistance = parseFloat(document.getElementById('realDistance').value);

    pixelsPerCm = pixelDistance / realDistance;

    alert("Escala calibrada!");
  }
});

thresholdSlider.addEventListener('input', processImage);

function processImage(){

  if(!img.src) return;

  ctx.drawImage(img,0,0);

  const threshold = parseInt(thresholdSlider.value);

  const imageData = ctx.getImageData(0,0,canvas.width,canvas.height);

  const data = imageData.data;

  for(let i=0;i<data.length;i+=4){

    const r = data[i];
    const g = data[i+1];
    const b = data[i+2];

    const gray = (r+g+b)/3;

    const value = gray > threshold ? 255 : 0;

    data[i] = value;
    data[i+1] = value;
    data[i+2] = value;
  }

  ctx.putImageData(imageData,0,0);
}

calculateBtn.addEventListener('click', calculateEquivalentField);

function calculateEquivalentField(){

  if(!pixelsPerCm){

    alert("Calibre a escala primeiro.");
    return;
  }

  processImage();

  const imageData = ctx.getImageData(0,0,canvas.width,canvas.height);
  const data = imageData.data;

  let areaPixels = 0;
  let perimeterPixels = 0;

  const width = canvas.width;
  const height = canvas.height;

  function isWhite(index){
    return data[index] === 255;
  }

  for(let y=1; y<height-1; y++){

    for(let x=1; x<width-1; x++){

      const idx = (y * width + x) * 4;

      if(isWhite(idx)){

        areaPixels++;

        const neighbors = [
          ((y-1)*width + x)*4,
          ((y+1)*width + x)*4,
          (y*width + (x-1))*4,
          (y*width + (x+1))*4
        ];

        let border = false;

        for(let n of neighbors){

          if(!isWhite(n)){
            border = true;
          }
        }

        if(border){
          perimeterPixels++;
        }
      }
    }
  }

  const areaCm2 = areaPixels / (pixelsPerCm * pixelsPerCm);

  const perimeterCm = perimeterPixels / pixelsPerCm;

  const ceq = (4 * areaCm2) / perimeterCm;

  document.getElementById('results').innerHTML = `
    <b>Área:</b> ${areaCm2.toFixed(2)} cm²<br><br>
    <b>Perímetro:</b> ${perimeterCm.toFixed(2)} cm<br><br>
    <b>Campo Equivalente:</b> ${ceq.toFixed(2)} cm
  `;
}

</script>

</body>
</html>
