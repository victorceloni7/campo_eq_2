<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Campo Equivalente Colimado</title>

<style>

body{
    font-family:Arial, sans-serif;
    margin:20px;
    background:#f5f5f5;
}

h2{
    margin-bottom:10px;
}

canvas{
    border:1px solid #444;
    background:white;
    cursor:crosshair;
}

.toolbar{
    margin:10px 0;
}

button{
    padding:8px 12px;
    margin-right:5px;
    cursor:pointer;
}

#resultado{
    margin-top:15px;
    font-size:18px;
    background:white;
    padding:10px;
    border:1px solid #ccc;
}

.info{
    margin-top:10px;
    background:white;
    padding:10px;
    border:1px solid #ccc;
}

</style>
</head>

<body>

<h2>Estimador de Campo Equivalente Colimado</h2>

<input type="file" id="arquivo" accept="image/*">

<div class="toolbar">

Zoom:

<input type="range"
       id="zoom"
       min="20"
       max="600"
       value="100">

<span id="zoomTexto">100%</span>

</div>

<div class="toolbar">

<button onclick="modo='escala'">
Calibrar Escala
</button>

<button onclick="modo='contorno'">
Contornar Campo
</button>

<button onclick="desfazer()">
Desfazer Último Ponto
</button>

<button onclick="limparContorno()">
Limpar Contorno
</button>

<button onclick="calcularCampo()">
Calcular Campo
</button>

</div>

<div class="info">

<b>Passo 1:</b> Clique em dois pontos de distância conhecida.<br>
<b>Passo 2:</b> Informe a distância real em cm.<br>
<b>Passo 3:</b> Contorne o campo colimado com vários pontos.<br>
<b>Passo 4:</b> Clique em "Calcular Campo".

</div>

<br>

<canvas id="canvas"></canvas>

<div id="resultado"></div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let imagem = new Image();

let zoom = 1;

let modo = "escala";

let escalaPts = [];
let cmPorPixel = null;

let contorno = [];

document.getElementById("arquivo").onchange = function(e){

    const arquivo = e.target.files[0];

    if(!arquivo) return;

    const leitor = new FileReader();

    leitor.onload = function(ev){

        imagem.onload = function(){
            desenhar();
        }

        imagem.src = ev.target.result;
    }

    leitor.readAsDataURL(arquivo);
};

document.getElementById("zoom").oninput = function(){

    zoom = this.value / 100;

    document.getElementById("zoomTexto").innerHTML =
        this.value + "%";

    desenhar();
};

canvas.addEventListener("click", function(e){

    const r = canvas.getBoundingClientRect();

    const x = (e.clientX - r.left) / zoom;
    const y = (e.clientY - r.top) / zoom;

    if(modo==="escala"){

        escalaPts.push({x,y});

        if(escalaPts.length===2){

            const dPixel = Math.hypot(
                escalaPts[1].x - escalaPts[0].x,
                escalaPts[1].y - escalaPts[0].y
            );

            const distanciaReal =
                parseFloat(
                    prompt("Distância real (cm):")
                );

            if(distanciaReal>0){

                cmPorPixel =
                    distanciaReal / dPixel;

                alert(
                    "Escala calibrada com sucesso."
                );
            }
        }
    }

    if(modo==="contorno"){

        contorno.push({x,y});
    }

    desenhar();

});

function desenhar(){

    if(!imagem.src) return;

    canvas.width = imagem.width * zoom;
    canvas.height = imagem.height * zoom;

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.drawImage(
        imagem,
        0,
        0,
        canvas.width,
        canvas.height
    );

    desenharEscala();

    desenharContorno();
}

function desenharEscala(){

    if(escalaPts.length===0) return;

    ctx.lineWidth = 3;
    ctx.strokeStyle = "red";

    escalaPts.forEach(p=>{

        ctx.beginPath();

        ctx.arc(
            p.x*zoom,
            p.y*zoom,
            8,
            0,
            Math.PI*2
        );

        ctx.fillStyle = "yellow";
        ctx.fill();

        ctx.stroke();
    });

    if(escalaPts.length===2){

        ctx.beginPath();

        ctx.moveTo(
            escalaPts[0].x*zoom,
            escalaPts[0].y*zoom
        );

        ctx.lineTo(
            escalaPts[1].x*zoom,
            escalaPts[1].y*zoom
        );

        ctx.stroke();
    }
}

function desenharContorno(){

    if(contorno.length===0) return;

    ctx.beginPath();

    ctx.moveTo(
        contorno[0].x*zoom,
        contorno[0].y*zoom
    );

    for(let i=1;i<contorno.length;i++){

        ctx.lineTo(
            contorno[i].x*zoom,
            contorno[i].y*zoom
        );
    }

    if(contorno.length>2){

        ctx.closePath();

        ctx.fillStyle =
            "rgba(0,255,0,0.20)";

        ctx.fill();
    }

    ctx.strokeStyle = "#00ff00";
    ctx.lineWidth = 3;
    ctx.stroke();

    contorno.forEach((p,i)=>{

        ctx.beginPath();

        ctx.arc(
            p.x*zoom,
            p.y*zoom,
            7,
            0,
            Math.PI*2
        );

        if(i===0)
            ctx.fillStyle="red";
        else
            ctx.fillStyle="cyan";

        ctx.fill();

        ctx.lineWidth = 2;
        ctx.strokeStyle="black";
        ctx.stroke();

        ctx.fillStyle="white";
        ctx.font="12px Arial";

        ctx.fillText(
            i+1,
            p.x*zoom+10,
            p.y*zoom-10
        );

    });
}

function desfazer(){

    contorno.pop();

    desenhar();
}

function limparContorno(){

    contorno=[];

    desenhar();

    document.getElementById(
        "resultado"
    ).innerHTML="";
}

function calcularCampo(){

    if(cmPorPixel===null){

        alert(
          "Calibre a escala primeiro."
        );

        return;
    }

    if(contorno.length<3){

        alert(
          "Defina pelo menos 3 pontos."
        );

        return;
    }

    let area=0;
    let perimetro=0;

    for(
        let i=0;
        i<contorno.length;
        i++
    ){

        let j =
          (i+1)%contorno.length;

        area +=
            contorno[i].x*
            contorno[j].y
            -
            contorno[j].x*
            contorno[i].y;

        perimetro += Math.hypot(
            contorno[j].x -
            contorno[i].x,

            contorno[j].y -
            contorno[i].y
        );
    }

    area =
        Math.abs(area)/2;

    const areaCm2 =
        area *
        cmPorPixel *
        cmPorPixel;

    const periCm =
        perimetro *
        cmPorPixel;

    const ceq =
        (4*areaCm2) /
        periCm;

    document.getElementById(
        "resultado"
    ).innerHTML =

    "<b>Área:</b> "
    + areaCm2.toFixed(2)
    + " cm²<br><br>"

    + "<b>Perímetro:</b> "
    + periCm.toFixed(2)
    + " cm<br><br>"

    + "<b>Campo Equivalente (Sterling):</b> "
    + ceq.toFixed(2)
    + " cm";
}

</script>

</body>
</html>
